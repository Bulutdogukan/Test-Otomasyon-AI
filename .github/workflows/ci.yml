name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Bagimlilik kurulumu
        run: npm ci

      - name: TypeScript tip kontrolu
        run: npm run typecheck

      - name: Node sozdizimi kontrolu
        run: node --check server.js ai-agent2.js src/**/*.js
