services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  qa-server:
    build: .
    ports:
      - "3000:3000"
    environment:
      - OLLAMA_URL=http://ollama:11434/api/chat
      - OLLAMA_MODEL=qwen2.5-coder:7b
      - HEADLESS=true
      - HOST=0.0.0.0
    depends_on:
      - ollama
    volumes:
      - ./tests/generated:/app/tests/generated
      - ./allure-report:/app/allure-report

volumes:
  ollama_data:
