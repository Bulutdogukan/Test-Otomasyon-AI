name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Bağımlılık kurulumu
        run: npm ci

      - name: TypeScript tip kontrolü
        run: npm run typecheck

      - name: Node sözdizimi kontrolü
        run: node --check server.js ai-agent2.js src/**/*.js

      # Birim testleri Ollama gerektirmez; DOM tarayıcı testleri headless Chromium kullanır.
      - name: Chromium kurulumu
        run: npx playwright install --with-deps chromium

      - name: Birim testleri
        run: npm run test:unit
