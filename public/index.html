<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Destekli Web Test Otomasyonu</title>
    <style>
        /* CSS Reset ve Temel Ayarlar */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0f19; color: #d1d5db; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .app-container { display: flex; flex-direction: column; height: 100%; width: 100%; }
        
        /* Sol Menü */
        .sidebar { background-color: #111827; padding: 25px; display: flex; flex-direction: column; overflow-y: auto; border-bottom: 1px solid #1f2937; }
        .header { margin-bottom: 25px; }
        .header h1 { color: #facc15; font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .header p { color: #6b7280; font-size: 13px; margin-top: 4px; }

        /* Form ve Inputlar */
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 500; color: #9ca3af; margin-bottom: 6px; }
        input[type="text"], textarea { width: 100%; background: #0b0f19; border: 1px solid #374151; color: #e5e7eb; padding: 10px 12px; border-radius: 6px; font-size: 14px; transition: border 0.2s; font-family: inherit; }
        
        /* İstediğin Ok Kaldırma Düzenlemesi */
        textarea { resize: none; } 
        
        input[type="text"]:focus, textarea:focus { outline: none; border-color: #facc15; }

        /* Sürükle-Bırak */
        .dropzone { border: 1.5px dashed #4b5563; border-radius: 6px; padding: 20px; text-align: center; background: #1f2937; cursor: pointer; transition: all 0.2s; margin-bottom: 15px; font-size: 13px; color: #9ca3af; }
        .dropzone:hover, .dropzone.dragover { border-color: #facc15; background: #2a220e; color: #facc15; }
        .dropzone input[type="file"] { display: none; }

        /* Butonlar */
        .toggles { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; background: #0b0f19; padding: 12px; border-radius: 6px; border: 1px solid #1f2937; }
        .toggles label { color: #d1d5db; display: flex; align-items: center; cursor: pointer; font-size: 13px; margin: 0; }
        .toggles input { margin-right: 10px; accent-color: #facc15; }

        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 10px; border: none; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .btn-start { background-color: #facc15; color: #111827; }
        .btn-start:hover { background-color: #ca8a04; }
        .btn-start:disabled { background-color: #374151; color: #9ca3af; cursor: not-allowed; }
        .btn-report { background-color: transparent; color: #facc15; border: 1px solid #facc15; display: none; }
        .btn-report:hover { background-color: #facc15; color: #111827; }

        /* Sağ Alan (Loglar & Kodlar) */
        .main-content { flex: 1; display: flex; flex-direction: column; background: #0b0f19; overflow: hidden; padding: 15px; gap: 15px; }
        
        .pane { background: #111827; border: 1px solid #1f2937; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
        .terminal-pane { flex: 6; }
        .code-pane { flex: 4; display: none; } 

        .pane-header { background: #1f2937; padding: 8px 15px; font-size: 13px; color: #9ca3af; display: flex; justify-content: space-between; align-items: center; }
        .terminal { flex: 1; overflow-y: auto; padding: 15px; font-family: monospace; font-size: 13px; color: #34d399; white-space: pre-wrap; line-height: 1.6; }
        
        /* Tab Yapısı */
        .tabs { display: flex; gap: 5px; }
        .tab { padding: 6px 12px; font-size: 12px; cursor: pointer; border-radius: 4px; background: transparent; color: #9ca3af; }
        .tab.active { background: #374151; color: #facc15; font-weight: 600; }
        .code-block { flex: 1; overflow-y: auto; padding: 15px; font-family: monospace; font-size: 13px; color: #93c5fd; white-space: pre-wrap; background: transparent; }
        
        .btn-download { background: #374151; color: #fff; padding: 4px 10px; font-size: 12px; border-radius: 4px; }
        .btn-download:hover { background: #4b5563; }

        @media (min-width: 800px) {
            .app-container { flex-direction: row; }
            .sidebar { width: 340px; min-width: 340px; border-bottom: none; border-right: 1px solid #1f2937; height: 100vh; }
            .main-content { height: 100vh; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="sidebar">
        <div class="header">
            <h1>⚙️ METİN HASDEMİR TEST CANAVARI</h1>
            <p>Web Otomasyon Test Platformu</p>
        </div>

        <div class="input-group">
            <label>Hedef URL</label>
            <input type="text" id="url" placeholder="https://example.com">
        </div>

        <div class="input-group">
            <label>Dosyadan Yükle (.txt, .feature)</label>
            <div class="dropzone" id="dropzone">
                <span id="dropzoneText">📄 Dosyayı sürükleyin veya seçin (Otomatik başlar)</span>
                <input type="file" id="fileInput" accept=".txt, .feature, .md">
            </div>
        </div>

        <div class="input-group">
            <label>Senaryo (Düz Metin veya Gherkin)</label>
            <textarea id="prompt" rows="5" placeholder="Kullanıcı arama kutusuna 'kredi' yazar..."></textarea>
        </div>

        <div class="toggles">
            <label><input type="checkbox" id="useGrid"> ☁️ Uzak Sunucuda (Selenium Grid) Çalıştır</label>
            <label><input type="checkbox" id="video" checked> Hatada Video</label>
            <label><input type="checkbox" id="screenshot" checked> Hatada Ekran Görüntüsü</label>
        </div>

        <div class="btn-group">
            <button id="startBtn" class="btn-start" onclick="startTest()">▶ Testi Başlat</button>
            <button id="reportBtn" class="btn-report" onclick="openReport()">📊 Rapor</button>
        </div>
    </div>

    <div class="main-content">
        <div class="pane terminal-pane">
            <div class="pane-header">
                <span>>_ Konsol Logları</span>
                <span id="status" style="color: #9ca3af;">Bekliyor...</span>
            </div>
            <div id="terminal" class="terminal">Sistem hazır.</div>
        </div>

        <div class="pane code-pane" id="codeContainer">
            <div class="pane-header">
                <div class="tabs">
                    <div class="tab active" id="tabTs" onclick="switchTab('ts')">Playwright (.ts)</div>
                    <div class="tab" id="tabFeature" onclick="switchTab('feature')">BDD Gherkin (.feature)</div>
                </div>
                <button class="btn-download" onclick="downloadCurrentCode()">⬇ İndir</button>
            </div>
            <pre class="code-block" id="codeBlock">// Kod bekleniyor...</pre>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let codeData = { ts: "", feature: "" };
    let currentTab = "ts";

    const terminal = document.getElementById('terminal');
    const startBtn = document.getElementById('startBtn');
    const reportBtn = document.getElementById('reportBtn');
    const statusSpan = document.getElementById('status');
    const dropzoneText = document.getElementById('dropzoneText');
    const codeContainer = document.getElementById('codeContainer');
    const codeBlock = document.getElementById('codeBlock');

    // Socket Eventleri (Merkezi Konum)
    socket.on('log', (msg) => {
        // 🔒 Güvenlik: log içeriği hedef siteden/AI'dan gelir. innerHTML yerine metin olarak
        // eklenir; aksi halde element metnindeki <script>/<img onerror> gibi içerik XSS'e yol açardı.
        terminal.insertAdjacentText('beforeend', msg.replace(/\x1b\[[0-9;]*m/g, ''));
        terminal.scrollTop = terminal.scrollHeight;
    });

    socket.on('test_finished', () => {
        startBtn.disabled = false; startBtn.innerHTML = "▶ Yeni Test";
        reportBtn.style.display = "block";
        statusSpan.style.color = "#34d399"; statusSpan.innerText = "Tamamlandı";
    });

    socket.on('test_code', (data) => {
        codeData = data;
        codeContainer.style.display = "flex"; 
        switchTab('ts'); 
    });

    socket.on('redirect_to_report', () => {
        window.open('/allure/index.html?t=' + Date.now(), '_blank');
    });

    // Sekme Yönetimi
    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tabTs').classList.remove('active');
        document.getElementById('tabFeature').classList.remove('active');
        
        if (tab === 'ts') {
            document.getElementById('tabTs').classList.add('active');
            codeBlock.style.color = '#93c5fd'; 
            codeBlock.innerText = codeData.ts;
        } else {
            document.getElementById('tabFeature').classList.add('active');
            codeBlock.style.color = '#fde047'; 
            codeBlock.innerText = codeData.feature;
        }
    }

    function downloadCurrentCode() {
        if (!codeData[currentTab]) return;
        const ext = currentTab === 'ts' ? 'spec.ts' : 'feature';
        const blob = new Blob([codeData[currentTab]], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `ai_otonom_test.${ext}`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    // Dosya Yükleme Mantığı
    const fileInput = document.getElementById('fileInput');
    const dropzone = document.getElementById('dropzone');
    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', e => {
        e.preventDefault(); dropzone.classList.remove('dragover');
        if(e.dataTransfer.files.length) { fileInput.files = e.dataTransfer.files; handleFileUpload(); }
    });
    fileInput.addEventListener('change', handleFileUpload);

    async function handleFileUpload() {
        if (!fileInput.files[0]) return;
        const file = fileInput.files[0];
        dropzoneText.innerText = `⏳ Okunuyor: ${file.name}`;
        const formData = new FormData(); formData.append('scenarioFile', file);

        try {
            const response = await fetch('/upload', { method: 'POST', body: formData });
            const data = await response.json();
            if(data.content) {
                document.getElementById('prompt').value = data.content;
                dropzoneText.innerText = `✅ Yüklendi: ${file.name}`;
                if(document.getElementById('url').value) startTest();
            }
        } catch(err) { dropzoneText.innerText = `❌ Hata`; }
    }

    function startTest() {
        const url = document.getElementById('url').value;
        const prompt = document.getElementById('prompt').value;
        if(!url || !prompt) { alert("Lütfen URL ve Senaryo girin."); return; }

        terminal.innerHTML = ""; codeContainer.style.display = "none";
        startBtn.disabled = true; startBtn.innerHTML = "⏳ Test Ediliyor...";
        reportBtn.style.display = "none";
        statusSpan.style.color = "#facc15"; statusSpan.innerText = "Yürütülüyor...";

        // YENİ: useGrid verisi okunup backend'e gönderiliyor
        socket.emit('start_test', { 
            url, 
            prompt, 
            video: document.getElementById('video').checked, 
            screenshot: document.getElementById('screenshot').checked,
            useGrid: document.getElementById('useGrid').checked
        });
    }

    function openReport() { socket.emit('open_report'); }
</script>
</body>
</html>
